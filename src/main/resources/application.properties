# Server Configuration
server.port=${PORT:8080}

# Application Info
spring.application.name=CareerFitAI

# Database Configuration (MySQL - Aiven)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/careerfitai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# File Upload Configuration (5 MB maximum)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.enabled=true

# CORS Configuration
# Comma-separated allowed frontend origins
cors.allowed-origins=${FRONTEND_URL:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:5173,https://*.vercel.app}

# Actuator Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
